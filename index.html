<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Game</title>
<style>
:root{--bg:#e9eef5;--fg:#1c2330;--card:rgba(255,255,255,.88);--line:rgba(0,0,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141821;--fg:#e8ecf3;--card:rgba(30,36,48,.88);--line:rgba(255,255,255,.15)}}
:root[data-theme="dark"]{--bg:#141821;--fg:#e8ecf3;--card:rgba(30,36,48,.88);--line:rgba(255,255,255,.15)}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{display:block;width:100%;height:100%}
.hud{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:12px}
</style></head>
<body><canvas id="c"></canvas>
<div class="hud"><kbd>WASD</kbd> di chuyển · <kbd>Space</kbd> nhảy · <kbd>J</kbd> chém · <kbd>K</kbd> cầu lửa · <kbd>L</kbd> lướt · <kbd>C</kbd> đổi camera · <kbd>1-9</kbd> spawn enemy</div>
<script type="module" src="/src/main.js"></script></body></html>
